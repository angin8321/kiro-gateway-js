<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple Kiro Gateway Admin</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    label { display: block; margin-top: 10px; }
    textarea { width: 100%; height: 120px; }
    pre { background: #111; color: #0f0; padding: 10px; white-space: pre-wrap; }
    .row { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Simple Kiro Gateway Admin</h1>

  <section>
    <h2>Check Models</h2>
    <div class="row">
      <label>Admin API Key (same as PROXY_API_KEY)</label>
      <input id="adminKey" type="password" style="width: 300px" />
    </div>
    <button id="btnModels">GET /v1/models</button>
    <pre id="modelsResult"></pre>
  </section>

  <section>
    <h2>Usage (Credits)</h2>
    <button id="btnUsage">GET /v1/usage</button>
    <pre id="usageResult"></pre>
  </section>

  <section>
    <h2>Test Chat Completion</h2>
    <div class="row">
      <label>Model</label>
      <input id="model" value="claude-haiku-4.5" style="width: 300px" />
    </div>
    <div class="row">
      <label>Prompt</label>
      <textarea id="prompt">Halo, jelaskan apa itu Simple Kiro Gateway secara singkat.</textarea>
    </div>
    <button id="btnChat">POST /v1/chat/completions</button>
    <pre id="chatResult"></pre>
  </section>

  <script>
    const baseUrl = ""; // same origin

    document.getElementById("btnModels").onclick = async () => {
      const key = document.getElementById("adminKey").value;
      const res = await fetch(`${baseUrl}/v1/models`, {
        headers: { Authorization: `Bearer ${key}` },
      });
      const txt = await res.text();
      document.getElementById("modelsResult").textContent = txt;
    };

    document.getElementById("btnChat").onclick = async () => {
      const key = document.getElementById("adminKey").value;
      const model = document.getElementById("model").value;
      const prompt = document.getElementById("prompt").value;

      const res = await fetch(`${baseUrl}/v1/chat/completions`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${key}`,
        },
        body: JSON.stringify({
          model,
          messages: [{ role: "user", content: prompt }],
          stream: false,
        }),
      });
      const txt = await res.text();
      document.getElementById("chatResult").textContent = txt;
    };

    document.getElementById("btnUsage").onclick = async () => {
      const key = document.getElementById("adminKey").value;
      const res = await fetch(`${baseUrl}/v1/usage`, {
        headers: { Authorization: `Bearer ${key}` },
      });
      const txt = await res.text();
      document.getElementById("usageResult").textContent = txt;
    };
  </script>
</body>
</html>
